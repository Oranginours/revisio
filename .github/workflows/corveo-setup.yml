# Une seule fois : crée le projet Corvéo chez Expo et l'enregistre dans corveo/app.json.
name: Corvéo · installation
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corveo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm install
      - run: eas init --non-interactive --force
      - run: eas update:configure --platform android --non-interactive
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json package.json package-lock.json
          git commit -m "Corvéo : projet Expo créé" || echo "rien à enregistrer"
          git push
