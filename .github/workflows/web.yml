# Publie la version navigateur de Révisio sur GitHub Pages à chaque mise à jour.
name: Version web
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Les modules web ne servent qu'ici : ils ne sont pas dans l'appli Android
      - run: npx expo install react-dom react-native-web @expo/metro-runtime
      - run: npx expo export --platform web
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      # Corvéo (l'appli des tâches ménagères) dans /revisio/corveo/
      - name: Corvéo web
        working-directory: corveo
        run: |
          npm ci || npm install
          npx expo install react-dom react-native-web @expo/metro-runtime
          npx expo export --platform web --output-dir ../dist/corveo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
