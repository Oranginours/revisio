# À chaque fois que du code arrive sur GitHub, cette action publie la mise à jour de l'appli.
name: Mise à jour de l'appli
on:
  push:
    branches: [main, master]
    paths-ignore: ['corveo/**', '.github/workflows/corveo-*']
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: eas update --channel preview --message "${{ github.event.head_commit.message || 'mise à jour' }}" --non-interactive
